name: Validar projecto

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Verificar aplicação
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxe e estrutura
        run: npm run check
